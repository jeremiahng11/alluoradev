{% extends "dashboard/_layout.html" %}
{% block title %}Confirm delete{% endblock %}

{% block dashboard %}
<div class="max-w-lg">
  <h1 class="font-display text-3xl text-stone-900 mb-4">Delete this?</h1>
  <p class="text-stone-600 mb-6">You're about to delete <strong>{{ object }}</strong>. This can't be undone.</p>
  <form method="post" class="flex gap-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{{ request.META.HTTP_REFERER|default:'/dashboard/' }}" class="btn btn-ghost">Cancel</a>
  </form>
</div>
{% endblock %}
