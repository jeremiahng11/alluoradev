<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Alluora Dashboard{% endblock %}</title>

  <!-- PWA: lets the dashboard be installed as a standalone desktop /
       mobile app via Chrome's install button or Safari's "Add to Home
       Screen". The manifest + icons are generated server-side by
       apps/dashboard/pwa.py — no build step needed. -->
  <link rel="manifest" href="{% url 'dashboard:pwa-manifest' %}">
  <meta name="theme-color" content="#DD5430">
  <meta name="application-name" content="Alluora Admin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Alluora Admin">
  <link rel="apple-touch-icon" sizes="192x192" href="{% url 'dashboard:pwa-icon' size=192 %}">
  <link rel="apple-touch-icon" sizes="512x512" href="{% url 'dashboard:pwa-icon' size=512 %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% url 'dashboard:pwa-icon' size=192 %}">
  <link rel="icon" type="image/png" sizes="48x48" href="{% url 'dashboard:pwa-icon' size=48 %}">

  <!-- Tailwind via CDN — fine for small admin dashboards. For larger ones,
       compile via npm; the CDN is rate-limited and not recommended for prod
       customer pages. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#FBF1EA',
              100: '#F3D8C4',
              200: '#EBB89A',
              300: '#E0976F',
              400: '#D87850',
              500: '#DD5430',
              600: '#C44525',
              700: '#9C361D',
              800: '#732817',
              900: '#4F1B0F',
            },
            cream: '#FAF3E8',
          },
          fontFamily: {
            display: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Alpine.js for the small interactive bits -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <!-- HTMX — used for inline editing where it makes sense -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>

  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #FAF7F1; color: #1F1A14; }
    .form-input {
      width: 100%; padding: .65rem .9rem; border-radius: .5rem;
      border: 1px solid #d6d3d1; background: white;
      transition: border-color .15s, box-shadow .15s; outline: none;
    }
    .form-input:focus { border-color: #DD5430; box-shadow: 0 0 0 3px rgba(221,84,48,.15); }
    .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .55rem 1rem; border-radius: .5rem; font-weight: 500; transition: all .15s; }
    .btn-primary { background: #DD5430; color: white; }
    .btn-primary:hover { background: #C44525; }
    .btn-ghost { color: #57534e; }
    .btn-ghost:hover { background: #f5f5f4; }
    .btn-danger { background: #DC2626; color: white; }
    .btn-danger:hover { background: #B91C1C; }
    .pill { display: inline-flex; padding: .15rem .65rem; border-radius: 9999px; font-size: .75rem; font-weight: 500; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen">
{% block content %}{% endblock %}

<!-- PWA service worker registration. The SW is served from
     /dashboard/sw.js so its default scope is /dashboard/ — controls
     the whole admin app, doesn't bleed into /api/ or the public root
     redirect. Registration is fire-and-forget; a failure (SW
     disabled by the user, browser doesn't support it, page served
     over HTTP in dev) shouldn't break the page. -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('{% url "dashboard:pwa-sw" %}', {
      scope: '/dashboard/',
    }).catch((err) => {
      console.warn('[pwa] SW registration failed:', err);
    });
  });
}

// ─── Install button controller ─────────────────────────────────
// Wires #pwa-install-btn (rendered in _layout.html) so the user can
// install the dashboard as a standalone app on demand instead of
// waiting for Chrome's own install heuristic to surface its toolbar
// icon.
//
//   Chromium (Chrome / Edge / Brave / Opera) — listens for the
//     beforeinstallprompt event, stashes it, shows the button, and
//     fires .prompt() on click.
//   Safari (macOS / iOS) — never fires beforeinstallprompt; we
//     detect it via UA and surface an instructions overlay (no
//     programmatic install exists on these browsers).
//   Already installed (display-mode: standalone) — hide the button.
//   Firefox desktop — no install support; button stays hidden.
(function () {
  const btn = document.getElementById('pwa-install-btn');
  const helpModal = document.getElementById('pwa-install-help');
  const helpClose = document.getElementById('pwa-install-help-close');
  const helpBody = document.querySelector('[data-pwa-help-body]');
  if (!btn) return;

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if (isStandalone) {
    // Already installed and running in its own window — nothing to do.
    return;
  }

  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isSafariDesktop = /^((?!chrome|android).)*safari/i.test(ua)
    && /Macintosh/.test(ua);

  let deferredPrompt = null;

  function showBtn() {
    btn.classList.remove('hidden');
    btn.classList.add('flex');
  }

  function hideBtn() {
    btn.classList.remove('flex');
    btn.classList.add('hidden');
  }

  function showHelp(text) {
    if (!helpModal || !helpBody) return;
    helpBody.textContent = text;
    helpModal.classList.remove('hidden');
  }

  if (helpClose) {
    helpClose.addEventListener('click', () => {
      helpModal.classList.add('hidden');
    });
    helpModal.addEventListener('click', (e) => {
      if (e.target === helpModal) helpModal.classList.add('hidden');
    });
  }

  // Chromium path.
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    showBtn();
  });

  // If beforeinstallprompt never fires (Safari / iOS / Firefox) but
  // we still want a way for the user to discover the install path,
  // surface the button anyway and route it to instructions.
  if (isIOS || isSafariDesktop) {
    showBtn();
  }

  // Hide the button once the app is installed; the next launch
  // will run in standalone mode and the early return above kicks in.
  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    hideBtn();
  });

  btn.addEventListener('click', async () => {
    if (deferredPrompt) {
      try {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('[pwa] install', outcome);
      } catch (err) {
        console.warn('[pwa] prompt failed:', err);
      }
      deferredPrompt = null;
      hideBtn();
      return;
    }
    if (isIOS) {
      showHelp(
        'In Safari, tap the Share button (square with an up arrow), '
        + 'scroll down and choose “Add to Home Screen”. The dashboard '
        + 'will launch from your home screen like any other app.'
      );
      return;
    }
    if (isSafariDesktop) {
      showHelp(
        'In Safari, open the File menu and choose “Add to Dock”. '
        + 'The dashboard will launch in its own window from your Dock.'
      );
      return;
    }
    // Fallback for browsers that never fire beforeinstallprompt
    // (older Firefox, etc).
    showHelp(
      'Your browser doesn’t expose a one-click install. Try Chrome '
      + 'or Edge, or look for an “Install” / “Add to Home Screen” '
      + 'option in your browser’s menu.'
    );
  });
})();
</script>
</body>
</html>
