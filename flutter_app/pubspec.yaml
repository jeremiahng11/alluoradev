name: alluora_app
description: Alluora — skincare, content, and rewards.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # HTTP + cookies (matches the cookie-auth WP plugin)
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.2.0

  # Storage
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0

  # Webview (for shop checkout handoff)
  webview_flutter: ^4.10.0
  webview_cookie_manager: ^2.0.6

  # Video playback (Bunny HLS)
  video_player: ^2.9.2
  chewie: ^1.10.0

  # Misc
  intl: ^0.20.1
  flutter_markdown: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # Fonts come from google_fonts at runtime — no need to bundle ttf files.
  # See lib/theme/typography.dart.
